name: Format development branch
on:
  push:
    branches:
      - feat/oauth-resource-hardening
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'Donnarieix/auth'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/oauth-resource-hardening
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatting only
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "style: rustfmt on OAuth hardening branch"
            git push origin HEAD:feat/oauth-resource-hardening
          fi
