# Dedicated hostname; do not alter existing SEPPYL / Drive locations.
# Requires a valid certificate covering auth-test.donnarieix.fr.
# Restrict network reachability to private/VPN clients at the firewall
# or add explicit allow/deny directives after validating VPN addresses.
server {
    listen 80;
    server_name auth-test.donnarieix.fr;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name auth-test.donnarieix.fr;
    ssl_certificate /etc/letsencrypt/live/donnarieix.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/donnarieix.fr/privkey.pem;
    client_max_body_size 16k;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
