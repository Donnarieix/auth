# Install on infra-static (Nginx host), not inside the auth CT.
# Private test ingress. Add the WireGuard client subnet if required;
# this sample permits only LAN clients until that range is known.
# IMPORTANT: certificate MUST cover auth-test.donnarieix.fr.
server {
    listen 80;
    server_name auth-test.donnarieix.fr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name auth-test.donnarieix.fr;
    ssl_certificate /etc/letsencrypt/live/auth-test.donnarieix.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth-test.donnarieix.fr/privkey.pem;
    client_max_body_size 16k;

    location / {
        allow 192.168.1.0/24;
        # allow <YOUR-WIREGUARD-SUBNET>;
        deny all;

        proxy_pass http://192.168.1.142:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
